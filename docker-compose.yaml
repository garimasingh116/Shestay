services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: shestay-backend

    ports:
      - "8080:8080"

    env_file:
      - .env

    depends_on:
      - redis

  redis:
    image: redis:7-alpine

    container_name: shestay-redis

    ports:
      - "6379:6379"